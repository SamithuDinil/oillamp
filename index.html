<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ten Ceramic Oil Lamps — Dark Mode</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    /* Deep dark background */
    background-color: #080605;
    background-image: radial-gradient(circle at 50% 40%, #1a1310 0%, #080605 70%);
    color: #f0d7b4;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient light overlay that reacts to lit lamps */
  .ambient-overlay {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 80% 60% at 50% 55%,
      rgba(255, 140, 40, 0.15) 0%,
      rgba(255, 80, 10, 0.05) 45%,
      transparent 75%);
    opacity: calc(var(--ambient, 0) * 0.9);
    transition: opacity 1s ease;
  }

  /* Vignette for depth */
  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 70% 60% at 50% 45%,
      transparent 30%, rgba(0,0,0,0.85) 100%);
  }

  /* ================= HEADER / FOOTER ================= */
  .ui { position: relative; z-index: 4; text-align: center; margin-bottom: 20px; }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(18px, 2.5vw, 26px);
    font-weight: 400;
    letter-spacing: .25em;
    text-indent: .25em;
    text-transform: uppercase;
    color: #e8c79a;
    text-shadow: 0 0 20px rgba(255,150,50,.3);
  }

  .subtitle {
    margin: 0;
    font-size: 12px;
    letter-spacing: .15em;
    color: #8d7157;
    text-transform: uppercase;
  }

  /* ================= STAGE ================= */
  .stage {
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
    gap: 0;
    width: 100%;
    max-width: 1200px;
    margin: 20px 0;
  }

  /* ================= LAMP BUTTON ================= */
  .lamp {
    position: relative;
    width: 110px;
    aspect-ratio: 1 / 0.85; /* Wide and shallow bowl */
    flex: 0 0 auto;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transform:
      translateY(calc(var(--curve, 0) * 1px))
      rotate(calc(var(--rot, 0) * 1deg));
    transition: transform .4s cubic-bezier(.2, .8, .3, 1);
  }

  .lamp:hover {
    transform:
      translateY(calc(var(--curve, 0) * 1px - 6px))
      rotate(calc(var(--rot, 0) * 1deg))
      scale(1.04);
  }
  .lamp:focus-visible {
    outline: 2px solid #ff9900;
    outline-offset: 6px;
    border-radius: 12px;
  }

  .lamp-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    overflow: visible;
    display: block;
  }

  /* ================= LIGHTING EFFECTS ================= */
  .floor-glow {
    position: absolute; left: 50%; bottom: -15%;
    width: 140%; height: 40%; margin-left: -70%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%,
      rgba(255,140,40,.30), transparent 70%);
    filter: blur(8px);
    opacity: 0;
    transition: opacity .6s ease;
    pointer-events: none;
  }
  .lamp.lit .floor-glow { opacity: 1; }

  .halo {
    position: absolute;
    left: 20%; /* Over the wick */
    bottom: 60%;
    width: 200%;
    aspect-ratio: 1;
    transform: translate(-50%, 50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,150,40,.25) 0%,
      rgba(255,100,10,.08) 40%,
      transparent 60%);
    filter: blur(12px);
    opacity: 0;
    transition: opacity .6s ease;
    pointer-events: none;
  }
  .lamp.lit .halo {
    opacity: 1;
    animation: haloPulse 4s ease-in-out infinite;
  }
  @keyframes haloPulse {
    0%, 100% { transform: translate(-50%, 50%) scale(1); opacity: .8; }
    50%      { transform: translate(-50%, 50%) scale(1.06); opacity: 1; }
  }

  /* ================= FLAME ================= */
  .flame-wrap {
    position: absolute;
    left: 15%; /* On the left edge where the wick is */
    bottom: 58%;
    width: 28%;
    height: 90%;
    transform-origin: 50% 100%;
    transform: translateX(-50%) scale(.05);
    opacity: 0;
    transition: opacity .3s ease, transform .3s ease;
    pointer-events: none;
  }
  .lamp.lit .flame-wrap {
    opacity: 1;
    transform: translateX(-50%) scale(1);
    animation: ignite .6s cubic-bezier(.2, 1.4, .5, 1) both;
  }
  @keyframes ignite {
    0%   { transform: translateX(-50%) scale(.05); opacity: 0; }
    25%  { opacity: 1; }
    60%  { transform: translateX(-50%) scale(1.15); }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
  }

  .flame-glow {
    position: absolute;
    left: 50%; bottom: -15%;
    width: 300%; height: 200%;
    margin-left: -150%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 85%,
      rgba(255,180,50,.45) 0%,
      rgba(255,110,20,.15) 40%,
      transparent 70%);
    filter: blur(8px);
    mix-blend-mode: screen;
    animation: glowPulse 2.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: .8; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.05); }
  }

  .flame-outer, .flame-inner {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    margin: 0 auto;
    transform-origin: 50% 100%;
    will-change: transform, opacity;
  }

  .flame-outer {
    width: 100%; height: 100%;
    filter: blur(1px);
    animation: flickerOuter 1.1s ease-in-out infinite;
  }

  .flame-inner {
    width: 60%; height: 70%;
    bottom: 1.5%;
    filter: blur(.5px);
    animation: flickerInner .8s ease-in-out infinite;
  }

  .flame-blue {
    position: absolute;
    left: 50%; bottom: -2%;
    width: 50%; height: 12%;
    margin-left: -25%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%,
      rgba(100,150,255,.6) 0%,
      transparent 70%);
    filter: blur(1.5px);
    animation: flickerInner 1.5s ease-in-out infinite;
  }

  @keyframes flickerOuter {
    0%   { transform: scale(1, 1) rotate(-1deg); opacity: .95; }
    25%  { transform: scale(.98, 1.04) rotate(1.5deg); opacity: 1; }
    50%  { transform: scale(1.02, .96) rotate(-1.8deg); opacity: .9; }
    75%  { transform: scale(.99, 1.02) rotate(1deg); opacity: 1; }
    100% { transform: scale(1, 1) rotate(-1deg); opacity: .95; }
  }
  @keyframes flickerInner {
    0%   { transform: scale(1, 1) rotate(1.5deg); opacity: .95; }
    30%  { transform: scale(.96, 1.05) rotate(-2deg); opacity: 1; }
    60%  { transform: scale(1.04, .95) rotate(1deg); opacity: .9; }
    85%  { transform: scale(.98, 1.02) rotate(-1deg); opacity: 1; }
    100% { transform: scale(1, 1) rotate(1.5deg); opacity: .95; }
  }

  /* ================= SMOKE ================= */
  .smoke {
    position: absolute;
    left: 15%;
    bottom: 60%;
    width: 8px; height: 8px;
    margin-left: -4px;
    border-radius: 50%;
    background: rgba(200,200,200,.6);
    filter: blur(4px);
    opacity: 0;
    pointer-events: none;
  }
  .lamp.puffing .smoke { animation: smokePuff 1.2s ease-out forwards; }
  @keyframes smokePuff {
    0%   { opacity: .6; transform: translate(0, 0) scale(.5); }
    50%  { opacity: .3; transform: translate(-2px, -30px) scale(1.8); }
    100% { opacity: 0; transform: translate(2px, -60px) scale(2.5); }
  }

  /* ================= FOOTER / TOGGLE ================= */
  .footer {
    position: relative; z-index: 4;
    display: flex; align-items: center; gap: 18px;
    font-size: 12px; letter-spacing: .15em;
    text-transform: uppercase; color: #8d7157;
    font-weight: 500;
    margin-top: 20px;
  }
  .counter { color: #f0b060; font-weight: bold; }

  .sound-toggle {
    position: fixed; top: 20px; right: 20px; z-index: 6;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid #332518;
    background: rgba(30, 20, 10, 0.6);
    color: #c79a6a;
    font-size: 16px; line-height: 1;
    cursor: pointer;
    transition: background .2s, transform .2s;
  }
  .sound-toggle:hover {
    background: rgba(60, 40, 20, 0.8);
    transform: scale(1.05);
  }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 900px) {
    .lamp { width: 100px; }
    h1 { letter-spacing: .15em; }
  }
  @media (max-width: 600px) {
    .lamp { width: 80px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flame-outer, .flame-inner, .flame-blue,
    .halo, .flame-glow { animation: none !important; }
    .lamp, .floor-glow { transition: none; }
  }
</style>
</head>
<body>

  <div class="ambient-overlay"></div>
  <div class="vignette"></div>

  <!-- ============ SHARED SVG DEFS ============ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Floor shadow under the lamp (Darker for dark mode) -->
      <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="rgba(0,0,0,.85)"/>
        <stop offset="50%"  stop-color="rgba(0,0,0,.4)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
      </radialGradient>

      <!-- Main orange ceramic bowl gradient -->
      <linearGradient id="bowlGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#FFB300"/>
        <stop offset="40%"  stop-color="#FF8F00"/>
        <stop offset="80%"  stop-color="#E65C00"/>
        <stop offset="100%" stop-color="#B33A00"/>
      </linearGradient>

      <!-- Rim highlight -->
      <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#FFCA28"/>
        <stop offset="50%"  stop-color="#FFA000"/>
        <stop offset="100%" stop-color="#FF6F00"/>
      </linearGradient>

      <!-- Inside of the bowl (oil / darkness) -->
      <linearGradient id="innerGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#B33A00"/>
        <stop offset="100%" stop-color="#2B0A00"/>
      </linearGradient>

      <!-- Warm bounce light on the right side of the bowl when lit -->
      <radialGradient id="warmGlowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#FFD54F" stop-opacity=".45"/>
        <stop offset="60%"  stop-color="#FF8F00" stop-opacity=".1"/>
        <stop offset="100%" stop-color="#FF6F00" stop-opacity="0"/>
      </radialGradient>

      <!-- Flame Outer (Orange/Yellow) -->
      <linearGradient id="flameOuterGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"   stop-color="#FFE082" stop-opacity="0.9"/>
        <stop offset="30%"  stop-color="#FFB300" stop-opacity="0.95"/>
        <stop offset="60%"  stop-color="#FF8F00" stop-opacity="0.8"/>
        <stop offset="85%"  stop-color="#E65100" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#E65100" stop-opacity="0"/>
      </linearGradient>

      <!-- Flame Inner (Bright Yellow/White) -->
      <linearGradient id="flameInnerGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
        <stop offset="40%"  stop-color="#FFF59D" stop-opacity="1"/>
        <stop offset="80%"  stop-color="#FFCA28" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#FF8F00" stop-opacity="0"/>
      </linearGradient>
    </defs>
  </svg>

  <button class="sound-toggle" id="soundToggle" title="Toggle sound" aria-pressed="true">🔊</button>

  <header class="ui">
    <h1>Ceramic Oil Lamps</h1>
    <p class="subtitle">Click a lamp to light it</p>
  </header>

  <main class="stage" id="stage" aria-label="Ceramic oil lamps"></main>

  <footer class="footer">
    <span class="counter" id="counter">0 / 10 lit</span>
  </footer>

<script>
(function () {
  "use strict";

  const TOTAL   = 10;
  const stage   = document.getElementById("stage");
  const counter = document.getElementById("counter");
  const lamps   = [];

  /* =========================================================
     Build the 10 ceramic lamps
     ========================================================= */
  for (let i = 0; i < TOTAL; i++) {

    const lamp = document.createElement("button");
    lamp.type = "button";
    lamp.className = "lamp";
    lamp.setAttribute("aria-pressed", "false");
    lamp.setAttribute("aria-label", "Ceramic oil lamp " + (i + 1));

    /* Slight arc and rotation for natural placement */
    const mid = (TOTAL - 1) / 2;
    const d   = i - mid;
    lamp.style.setProperty("--curve", (Math.pow(Math.abs(d), 1.6) * 1.2).toFixed(2));
    lamp.style.setProperty("--rot", (d * 1.2).toFixed(2));

    lamp.innerHTML = `
      <div class="floor-glow"></div>
      <div class="halo"></div>

      <!-- viewBox 0 0 200 170 to match the wide aspect ratio -->
      <svg class="lamp-svg" viewBox="0 0 200 170" aria-hidden="true">
        
        <!-- Deep shadow on the floor -->
        <ellipse cx="100" cy="155" rx="80" ry="18" fill="url(#shadowGrad)"/>

        <!-- Bowl Body -->
        <path d="M 15 80 C 15 140, 60 145, 100 145 C 140 145, 185 140, 185 80 Z" fill="url(#bowlGrad)"/>
        
        <!-- Glossy Reflection on the bowl body -->
        <path d="M 30 95 C 30 120, 50 135, 70 140" stroke="rgba(255,255,255,0.25)" stroke-width="8" fill="none" stroke-linecap="round" filter="blur(2px)"/>
        
        <!-- Warm light bounce on the right side of the bowl when lit -->
        <ellipse class="warm-glow" cx="140" cy="110" rx="50" ry="40" fill="url(#warmGlowGrad)" opacity="0" style="transition: opacity 0.6s ease;"/>
        
        <!-- Bowl Rim -->
        <ellipse cx="100" cy="80" rx="85" ry="22" fill="url(#rimGrad)"/>
        
        <!-- Inside the bowl (oil / darkness) -->
        <ellipse cx="100" cy="80" rx="77" ry="16" fill="url(#innerGrad)"/>
        
        <!-- Inner rim highlight -->
        <ellipse cx="100" cy="80" rx="77" ry="16" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>

        <!-- Wick (Left side) -->
        <path d="M 30 82 Q 25 60 25 50" stroke="#111" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 28 70 Q 26 60 25 50" stroke="#444" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        
        <!-- Wick glowing tip -->
        <circle cx="25" cy="50" r="2.5" fill="#FFB300" opacity="0"/>
        <circle class="wick-ember" cx="25" cy="50" r="2.5" fill="#FFB300" opacity="0"/>
      </svg>

      <!-- ============ FLAME ============ -->
      <div class="flame-wrap">
        <div class="flame-glow"></div>

        <!-- Outer Flame (Teardrop shape) -->
        <svg class="flame-outer" viewBox="0 0 40 100" preserveAspectRatio="none" aria-hidden="true">
          <path d="M 20 5 C 35 30, 35 60, 20 95 C 5 60, 5 30, 20 5 Z" fill="url(#flameOuterGrad)"/>
        </svg>

        <!-- Inner Flame Core -->
        <svg class="flame-inner" viewBox="0 0 40 100" preserveAspectRatio="none" aria-hidden="true">
          <path d="M 20 25 C 28 45, 28 70, 20 90 C 12 70, 12 45, 20 25 Z" fill="url(#flameInnerGrad)"/>
        </svg>

        <!-- Blue base of flame -->
        <div class="flame-blue"></div>
      </div>

      <div class="smoke"></div>
    `;

    const style = document.createElement('style');
    style.textContent = `
      .lamp.lit .wick-ember { opacity: 1; animation: emberPulse 1s infinite; }
      .lamp.lit .warm-glow { opacity: 1; }
      @keyframes emberPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    `;
    document.head.appendChild(style);

    lamp.addEventListener("click", () => toggleLamp(lamp));

    /* De-sync the flicker of each lamp */
    const outer = lamp.querySelector(".flame-outer");
    const inner = lamp.querySelector(".flame-inner");
    const glow  = lamp.querySelector(".flame-glow");
    const blue  = lamp.querySelector(".flame-blue");
    if (outer) outer.style.animationDelay = `-${((i * 0.41) % 1.1).toFixed(2)}s`;
    if (inner) inner.style.animationDelay = `-${((i * 0.67) % 0.8).toFixed(2)}s`;
    if (glow)  glow.style.animationDelay  = `-${((i * 0.73) % 2.5).toFixed(2)}s`;
    if (blue)  blue.style.animationDelay  = `-${((i * 0.29) % 1.5).toFixed(2)}s`;

    stage.appendChild(lamp);
    lamps.push(lamp);
  }

  /* =========================================================
     Toggle a single lamp
     ========================================================= */
  function toggleLamp(lamp) {
    const isLit = lamp.classList.toggle("lit");
    lamp.setAttribute("aria-pressed", String(isLit));

    const ember = lamp.querySelector(".wick-ember");
    if (ember) {
      ember.style.opacity = isLit ? "1" : "0";
    }

    if (isLit) {
      playIgnite();
    } else {
      playExtinguish();
      lamp.classList.add("puffing");
      window.setTimeout(() => lamp.classList.remove("puffing"), 1300);
    }

    updateAmbient();
  }

  function updateAmbient() {
    let lit = 0;
    for (const l of lamps) if (l.classList.contains("lit")) lit++;
    counter.textContent = lit + " / " + TOTAL + " lit";
    
    // Update the CSS variable to increase the ambient glow overlay
    const warmth = Math.min(lit / TOTAL, 1);
    document.documentElement.style.setProperty("--ambient", warmth);
  }

  /* =========================================================
     Synthesized audio
     ========================================================= */
  let actx  = null;
  let muted = false;

  function getCtx() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === "suspended") actx.resume();
    return actx;
  }

  function noiseBuffer(ctx, seconds) {
    const len  = Math.floor(ctx.sampleRate * seconds);
    const buf  = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  function playIgnite() {
    if (muted) return;
    const ctx = getCtx();
    if (!ctx) return;

    const t   = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx, 0.6);

    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.Q.value = 0.85;
    bp.frequency.setValueAtTime(2000, t);
    bp.frequency.exponentialRampToValueAtTime(400, t + 0.4);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.08, t + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);

    src.connect(bp).connect(gain).connect(ctx.destination);
    src.start(t);
    src.stop(t + 0.6);
  }

  function playExtinguish() {
    if (muted) return;
    const ctx = getCtx();
    if (!ctx) return;

    const t   = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx, 0.35);

    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(1500, t);
    lp.frequency.exponentialRampToValueAtTime(200, t + 0.28);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.05, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);

    src.connect(lp).connect(gain).connect(ctx.destination);
    src.start(t);
    src.stop(t + 0.35);
  }

  const soundToggle = document.getElementById("soundToggle");
  soundToggle.addEventListener("click", () => {
    muted = !muted;
    soundToggle.textContent = muted ? "🔇" : "🔊";
    soundToggle.setAttribute("aria-pressed", String(!muted));
  });

  /* =========================================================
     Init
     ========================================================= */
  updateAmbient();
})();
</script>
</body>
</html>
